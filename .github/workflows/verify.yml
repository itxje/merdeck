name: Verify and release

on:
  pull_request:
  push:
    branches: [main, verify/native-readiness]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merdeck-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.package.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true
      - name: Install process and browser prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux strace
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            .cache/playwright
          key: merdeck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'web/bun.lock', '.bun-version', '.node-version') }}
      - name: Install frozen source dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd web --frozen-lockfile
      - name: Install verified workflow tool and browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
        run: |
          bun scripts/setup-ci-tools.ts
          web/node_modules/.bin/playwright install --with-deps chromium
      - name: Native source and executable acceptance
        run: bun scripts/ci/hosted.ts
      - name: Prepare bounded verification evidence
        id: evidence
        if: ${{ success() || failure() }}
        run: bun scripts/ci/evidence.ts
      - name: Upload bounded verification reports
        if: ${{ (success() || failure()) && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: tmp/ci-evidence/
          retention-days: 7
          if-no-files-found: warn
      - name: Retain the checked executable and the published bundle
        id: package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checked-release-${{ github.sha }}
          path: |
            dist/release/
            dist/bundle/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  publish:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'itxje/merdeck' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true
      - name: Install frozen publisher dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: dist/
          merge-multiple: true
          digest-mismatch: error
      - name: Verify and publish complete draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/publish-release.ts
